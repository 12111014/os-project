# Models are "<provider>:<model>" strings passed to langchain init_chat_model.
# Qwen is served through DashScope's OpenAI-compatible endpoint, so we use the
# "openai:" provider and point it at DashScope via env vars (see .env below):
#   OPENAI_API_KEY   = <your DashScope API key>
#   OPENAI_BASE_URL  = https://dashscope.aliyuncs.com/compatible-mode/v1
#   OPENAI_API_BASE  = https://dashscope.aliyuncs.com/compatible-mode/v1
models:
  mount_runner: "deepseek:deepseek-v4-pro"
  code_generator: "deepseek:deepseek-v4-pro"
  build_runner: "deepseek:deepseek-v4-pro"
  test_runner: "deepseek:deepseek-v4-pro"
  debugger: "deepseek:deepseek-v4-pro"

# Optional kwargs forwarded to init_chat_model as `extra_body`.
# Leave empty ({}) for a provider-agnostic call that works with both DeepSeek
# and Qwen. To turn off reasoning, set the provider-specific option here:
#   Qwen (DashScope):  {"enable_thinking": false}
#   DeepSeek:          {"thinking": {"type": "disabled"}}
model_extra_body: {"thinking": {"type": "disabled"}}


debug: true
# debug: false
